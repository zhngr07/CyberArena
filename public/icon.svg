<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>

  <!-- Cyber Grid Lines -->
  <path d="M64 128 H448 M64 256 H448 M64 384 H448 M128 64 V448 M256 64 V448 M384 64 V448" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Outer Hexagon Ring -->
  <polygon points="256,52 420,146 420,366 256,460 92,366 92,146" fill="none" stroke="url(#glowG)" stroke-width="8" filter="url(#neonGlow)"/>

  <!-- Inner Cyber Ship Crest -->
  <!-- Main Ship Body -->
  <polygon points="256,110 370,350 256,310 142,350" fill="url(#cyberNeon)" filter="url(#neonGlow)"/>

  <!-- Ship Core Cockpit -->
  <polygon points="256,160 310,310 256,285 202,310" fill="#030712" stroke="#06b6d4" stroke-width="4"/>

  <!-- Energy Thruster Flame -->
  <polygon points="256,325 285,410 256,380 227,410" fill="#ec4899" filter="url(#neonGlow)"/>
  <circle cx="256" cy="250" r="14" fill="#38bdf8" filter="url(#neonGlow)"/>

  <!-- Crosshairs Orbit -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="24 16" stroke-opacity="0.6"/>
  <line x1="256" y1="76" x2="256" y2="100" stroke="#06b6d4" stroke-width="4"/>
  <line x1="256" y1="412" x2="256" y2="436" stroke="#06b6d4" stroke-width="4"/>
  <line x1="76" y1="256" x2="100" y2="256" stroke="#06b6d4" stroke-width="4"/>
  <line x1="412" y1="256" x2="436" y2="256" stroke="#06b6d4" stroke-width="4"/>
</svg>
